name: Terreno Radar

on:
  # NOTE: Casa SAPO rate-limits (HTTP 429) GitHub's shared datacenter IPs, so the
  # scheduled cloud run can't fetch listings. Execution runs from home instead
  # (residential IP works). The manual trigger is kept for occasional testing.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:          # lets you run it manually from the Actions tab

# Don't let two runs overlap and fight over seen.json
concurrency:
  group: terreno-radar
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit seen.json back
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Persist seen listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "chore: update seen listings [skip ci]"
          git push
