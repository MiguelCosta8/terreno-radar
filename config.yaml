# ---------------------------------------------------------------------------
# Terreno Radar configuration
# ---------------------------------------------------------------------------

filters:
  max_price_eur: 80000
  min_area_m2: 300            # a modest floor for a house plot; lower/raise as you like

  # A listing must contain at least one of these to count as "probably buildable".
  # (Substrings, case-insensitive — "constru" catches construção AND construir.)
  buildability_keywords:
    - urbano
    - urbaniz
    - constru
    - viabilidade
    - pdm
    - edificab

  # If a listing contains any of these, it is dropped (rural / non-buildable,
  # or a rental rather than a sale — OLX mixes those in).
  exclude_keywords:
    - rústico
    - rustico
    - agrícola
    - agricola
    - florestal
    - alug        # alugar / aluga-se / aluguer  (rentals)
    - arrenda     # arrendar / arrendamento      (rentals)

# ---------------------------------------------------------------------------
# Your searches. For each: go to the portal, filter for TERRENOS in
# V.N. Famalicão / Guimarães / Santo Tirso under 80k, copy the browser URL here.
# Comment out (with #) any source you don't want yet. Start with ONE.
# ---------------------------------------------------------------------------

searches:
  - name: "Casa SAPO — terrenos Vila Nova de Famalicão"
    source: casasapo
    url: "https://casa.sapo.pt/comprar-terrenos/vila-nova-de-famalicao/"

  - name: "Casa SAPO — terrenos Guimarães"
    source: casasapo
    url: "https://casa.sapo.pt/comprar-terrenos/guimaraes/"

  - name: "Casa SAPO — terrenos Santo Tirso"
    source: casasapo
    url: "https://casa.sapo.pt/comprar-terrenos/santo-tirso/"

  - name: "Imovirtual — terrenos Vila Nova de Famalicão"
    source: imovirtual
    url: "https://www.imovirtual.com/pt/resultados/comprar/terreno/braga/vila-nova-de-famalicao"

  - name: "Imovirtual — terrenos Guimarães"
    source: imovirtual
    url: "https://www.imovirtual.com/pt/resultados/comprar/terreno/braga/guimaraes"

  - name: "Imovirtual — terrenos Santo Tirso"
    source: imovirtual
    url: "https://www.imovirtual.com/pt/resultados/comprar/terreno/porto/santo-tirso"

  - name: "OLX — terrenos Vila Nova de Famalicão"
    source: olx
    url: "https://www.olx.pt/imoveis/terrenos-quintas/q-vila-nova-de-famalicao/"

  - name: "OLX — terrenos Guimarães"
    source: olx
    url: "https://www.olx.pt/imoveis/terrenos-quintas/q-guimaraes/"

  - name: "OLX — terrenos Santo Tirso"
    source: olx
    url: "https://www.olx.pt/imoveis/terrenos-quintas/q-santo-tirso/"

  # Idealista is intentionally omitted — its DataDome anti-bot returns 403+CAPTCHA
  # to plain requests, so it needs a headless browser (heavy/fragile). Skipped for now.
